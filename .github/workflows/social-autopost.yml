name: Social Auto-Post Only

on:
  workflow_dispatch:
  schedule:
    # Four irregular windows a day, not one. The daily cap is what protects the
    # account's volume; spreading the runs is what protects its SHAPE. A single
    # run emitting the whole day's allowance produces a clump of posts seconds
    # apart, which is a louder automation signal than the count. Combined with
    # SOCIAL_RUN_LIMIT (a slice per run) and SOCIAL_POST_MIN_INTERVAL_SECONDS
    # (jittered spacing inside a run), the same daily volume lands as scattered
    # activity. Minutes are deliberately not round.
    - cron: '23 13 * * *'
    - cron: '17 16 * * *'
    - cron: '41 19 * * *'
    - cron: '9 22 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: authority-network-social-${{ github.ref }}
  cancel-in-progress: false

jobs:
  social-autopost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Post queued social items (non-blocking)
        continue-on-error: true
        env:
          # Enablement is DECLARED in data/social-brand-policy.json (platforms.*.enabled).
          # These pass the repository variable through as an override only: unset expands
          # to an empty string, which scripts/lib/social_platforms.py reads as "no opinion"
          # and defers to the declaration. A literal '|| true' here would be a second,
          # silent answer to a question the declaration already answers.
          ENABLE_LINKEDIN_POSTING: ${{ vars.ENABLE_LINKEDIN_POSTING }}
          ENABLE_X_POSTING: ${{ vars.ENABLE_X_POSTING }}
          REQUIRE_SOCIAL_SECRETS: ${{ vars.REQUIRE_SOCIAL_SECRETS || 'true' }}
          FAIL_ON_SOCIAL_POST_FAILURE: ${{ vars.FAIL_ON_SOCIAL_POST_FAILURE || 'false' }}
          SOCIAL_DRY_RUN: ${{ vars.SOCIAL_DRY_RUN || 'false' }}
          LINKEDIN_DAILY_LIMIT: ${{ vars.LINKEDIN_DAILY_LIMIT || '3' }}
          X_DAILY_LIMIT: ${{ vars.X_DAILY_LIMIT || '8' }}
          SOCIAL_RUN_LIMIT: ${{ vars.SOCIAL_RUN_LIMIT || '3' }}
          SOCIAL_POST_MIN_INTERVAL_SECONDS: ${{ vars.SOCIAL_POST_MIN_INTERVAL_SECONDS || '90' }}
          MAX_SOCIAL_SIMILARITY: ${{ vars.MAX_SOCIAL_SIMILARITY || '0.86' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202606' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          # The credential that actually carries X. X's own API above is
          # pay-per-use and unfunded, so it is switched off and contacted zero
          # times; this token hands the day's X posts to Buffer's free queue
          # instead. Read only here, at runtime, and never written to a file.
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          ENABLE_X_BUFFER_ROUTE: ${{ vars.ENABLE_X_BUFFER_ROUTE }}
        run: python3 scripts/social_publisher.py
      - name: Commit social ledger
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Authority V4.2 social auto-post ledger"
          file_pattern: "data/social-queue.json reports/social-publisher-report.json"
      - name: Surface what this run actually did
        # The posting step above is deliberately continue-on-error: a platform
        # refusing a post must never block content publication. But that also
        # meant NOTHING could turn this workflow red, so the failure-issue step
        # below was unreachable and the run on 2026-08-29 that failed 581 of 581
        # posts - the whole X queue - reported success with a green tick.
        #
        # Rule 0 applies to the run as a whole, not to the API alone. A run
        # that handed Buffer everything its free plan had room for is work
        # done, and it is reported as such. What is NOT allowed is a run that
        # posted nothing, routed nothing, and still had queued content waiting
        # with a route that was available - that is the silent-defer shape, and
        # it fails. Reads the receipt rather than the exit code, so the
        # non-blocking property of the posting step is preserved.
        #
        # "Deferred" is NOT that shape. Buffer's free plan caps how many posts
        # may sit queued at once, so a run that adds two and defers the rest is
        # the lane working correctly. Deferred entries keep
        # queued_for_auto_post and go out on a later run; nothing is asked of
        # anybody, and there is no sheet to check.
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path('reports/social-publisher-report.json')
          if not p.exists():
              print('No social publisher receipt was written; nothing to assess.')
              sys.exit(0)
          r = json.loads(p.read_text())
          attempts, successes = len(r.get('attempts', [])), len(r.get('successes', []))
          halted = r.get('halted_platforms') or {}
          queued = int(r.get('buffer_queued_this_run') or 0)
          deferred = int(r.get('deferred_waiting_for_delivery_route') or 0)
          route = ((r.get('delivery_routes') or {}).get('x') or {})
          receipt = route.get('receipt') or {}
          postable = r.get('still_postable_after_run')
          print(json.dumps({'status': r.get('status'), 'attempts': attempts,
                            'successes': successes, 'halted_platforms': halted,
                            'buffer_queued_this_run': queued,
                            'deferred_waiting_for_delivery_route': deferred,
                            'route_receipt': receipt,
                            'still_postable_after_run': postable}, indent=2))
          for platform, reason in halted.items():
              print(f'::warning::{platform} stopped this run early: {reason}')

          summary = pathlib.Path(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'))
          with summary.open('a') as fh:
              fh.write(f'## Social auto-post\n\nHanded to Buffer this run: **{queued}**. '
                       f'Posted directly: **{successes - queued}**. Attempted '
                       f'**{attempts}**.\n\n')
              fh.write(f'Waiting for room in Buffer: **{deferred}** '
                       f'(they stay queued and go out as Buffer drains -- '
                       f'nothing to do).\n\n')
              if receipt:
                  fh.write(f"Buffer ceilings discovered this run: "
                           f"`{receipt.get('ceilings_discovered')}`, bound by "
                           f"`{receipt.get('binding_ceiling')}`. Channel: "
                           f"`{receipt.get('channel_name')}` "
                           f"(`{receipt.get('channel_service')}`).\n\n")
              for s in r.get('successes', []):
                  if s.get('via') == 'buffer':
                      fh.write(f"- Buffer post `{s.get('id')}` - {s.get('brand')} "
                               f"(due {s.get('due_at')})\n")

          # The one shape Rule 0 forbids: nothing went out by ANY route while a
          # route was available and content was waiting. A route that reports
          # itself unavailable or full is a named state, not this.
          route_was_open = bool(receipt.get('available'))
          if route_was_open and attempts and not successes:
              print(f'::error::The Buffer route was available and all {attempts} '
                    f'attempts failed, so nothing was distributed by any route. '
                    f'Entries were deferred rather than dropped, so no distribution '
                    f'was lost. Named stop: {r.get("stop_reason") or halted}')
              sys.exit(1)
          if (r.get('status') == 'stopped_no_enabled_platform'
                  and (postable or 0) > 0):
              print(f'::error::Every social platform is switched off, no delivery '
                    f'route carried anything, and {postable} queued posts are '
                    f'waiting. Named stop: {r.get("stop_reason")}')
              sys.exit(1)
          if deferred and not queued and route_was_open:
              print(f'::warning::The Buffer route was open and took nothing while '
                    f'{deferred} entries waited. Ceilings: '
                    f'{receipt.get("ceilings_discovered")}.')
          PY

      - name: Create failure issue
        if: failure()
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ github.token }}
          title: "Authority social auto-post failed"
          body: "The social auto-post workflow failed. Check secrets, platform permissions, and reports/social-publisher-report.json."

name: Release Validation
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore validation cache
        uses: actions/cache@v4
        with:
          path: .validation-cache
          key: authority-validation-v4.5-${{ runner.os }}-py311-${{ hashFiles('package-lock.json', 'validation/**', 'scripts/page_validation.py', 'scripts/validate.py') }}
          restore-keys: |
            authority-validation-v4.5-${{ runner.os }}-py311-
      - name: Run one-level release validation
        run: python3 scripts/validate.py release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: authority-network-validation-receipts
          path: reports/
      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        run: |
          npm run cadence:gate
          npm run cadence:template-share

name: Hostile Review
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  hostile-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/hostile_review.py
      - run: python3 scripts/link_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authority-network-review-reports
          path: reports/

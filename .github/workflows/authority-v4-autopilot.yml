name: Authority Network V4.2 Autopilot + Social Auto-Post

on:
  workflow_dispatch:
    inputs:
      search_only:
        description: 'Measure search truth (Search Console + URL Inspection) and commit it, without publishing or posting'
        type: boolean
        default: false
  schedule:
    - cron: '22 14 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: authority-network-social-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The measured search loop (data/search_intelligence/, owner-approved 11 Oct
  # 2026). Runs first so the day's publishing freeze and page strengthening read
  # today's Search Console numbers, and commits its own truth so a later failure
  # in the publishing job never loses a day of measurement.
  search:
    timeout-minutes: 15  # 3 hosts in parallel, 150 inspections each at 8-way; ~3m expected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure Search Console truth, index coverage and sitemap registration
        id: collect
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/search_intelligence/collect_gsc.py
      - name: Strengthen what qualifies, then build the measured plan
        # Today's truth can qualify a family no entry covers yet. The loop
        # strengthens it in this run, from the page's own dek and questions
        # (derive_strengthening.py), before the plan is built and validated, so
        # the validator never fails an outcome nothing in the loop produces.
        run: |
          python3 scripts/search_intelligence/derive_strengthening.py --write
          python3 scripts/search_intelligence/apply_strengthening.py --write
          python3 scripts/search_intelligence/build_search_plan.py --write
      - name: Commit search truth, the measured plan and strengthened pages together
        # One commit, before validation: main never holds today's truth with
        # yesterday's plan (12 Oct 2026: the truth landed alone, the plan did
        # not, and every later `validate.py release` on main saw 13 stale-plan
        # failures). always(): a failure after collection never loses the day's
        # measurement.
        if: ${{ always() && steps.collect.outcome == 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Search intelligence: Search Console truth, measured plan, strengthening"
          file_pattern: "data/search_intelligence/** sites/**"
      - name: Validate the search loop
        run: |
          python3 scripts/validators/validate_search_intelligence.py
          python3 scripts/validators/validate_measured_urls_resolve.py

  autopilot:
    needs: search
    if: ${{ !inputs.search_only }}
    timeout-minutes: 18  # ~3x median 6.0m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The search job above has just pushed today's truth; the triggering
          # SHA would not contain it.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore validation cache
        uses: actions/cache@v4
        with:
          path: .validation-cache
          key: authority-validation-v4.5-${{ runner.os }}-py311-${{ hashFiles('package-lock.json', 'validation/**', 'scripts/page_validation.py', 'scripts/validate.py') }}
          restore-keys: |
            authority-validation-v4.5-${{ runner.os }}-py311-
      - name: Generate and publish authority pages
        env:
          DAILY_PAGE_LIMIT: ${{ vars.DAILY_PAGE_LIMIT || '3' }}
          ABSOLUTE_MAX_PAGES_PER_DAY: ${{ vars.ABSOLUTE_MAX_PAGES_PER_DAY || '9' }}
          MIN_BASE_PUBLISH_SCORE: ${{ vars.MIN_BASE_PUBLISH_SCORE || '72' }}
          # Optional rewrite goes through the $0-only free router (owner policy,
          # 11 Oct 2026); Gemini is no longer called.
          ENABLE_LLM_REWRITE: ${{ vars.ENABLE_LLM_REWRITE || vars.ENABLE_GEMINI_REWRITE || 'false' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINKEDIN_DAILY_LIMIT: ${{ vars.LINKEDIN_DAILY_LIMIT || '3' }}
          X_DAILY_LIMIT: ${{ vars.X_DAILY_LIMIT || '8' }}
          SOCIAL_RUN_LIMIT: ${{ vars.SOCIAL_RUN_LIMIT || '3' }}
          SOCIAL_POST_MIN_INTERVAL_SECONDS: ${{ vars.SOCIAL_POST_MIN_INTERVAL_SECONDS || '90' }}
          FOUNDER_PUBLICATION_DOMAIN: ${{ vars.FOUNDER_PUBLICATION_DOMAIN }}
          MEMPHIS_PUBLICATION_DOMAIN: ${{ vars.MEMPHIS_PUBLICATION_DOMAIN }}
          PROFESSIONAL_PUBLICATION_DOMAIN: ${{ vars.PROFESSIONAL_PUBLICATION_DOMAIN }}
        run: python3 scripts/authority_v4_autopilot.py
      - name: Carry source title and description changes onto existing pages
        # The scaffold generators never rewrite a page once it exists, so a
        # title or description fixed in its source (content-bank, demand_shape_content,
        # a builder's DESCRIPTION) would otherwise never reach the live page.
        # Idempotent; touches only the <title> and description. See its header.
        run: python3 scripts/sync_page_meta.py --write
      - name: Strengthen the pages measured demand qualifies
        # data/search_intelligence/strengthened_pages.json: query-first title,
        # definition, question H2s, one FAQPage, homepage links. Before the
        # navigation and chrome steps so their output wraps it; idempotent.
        run: |
          python3 scripts/search_intelligence/derive_strengthening.py --write
          python3 scripts/search_intelligence/apply_strengthening.py --write
      - name: Give the new pages a path in and a canonical that serves 200
        # Without this the three pages generated above are orphans the moment
        # they are written, which is the state that put all three publications
        # at zero indexed pages. It also fails loudly if the autopilot drew a
        # cluster that data/topic-taxonomy.json does not place in a hub, rather
        # than publishing a page nothing links to.
        run: python3 scripts/build_site_navigation.py --write
      - name: Refresh the editorial governance surface
        # There is no shared page shell in this repo -- five generators each
        # inline their own. These three scripts run last and are idempotent, so
        # whatever any generator emitted gets the masthead/standards/corrections
        # footer, the affiliate disclosure next to the affiliated citation, and
        # this publication's own favicon. Order matters: the pages must exist
        # before the chrome installer links them, and robots.txt reports page
        # counts so it runs after the day's pages are written.
        # The portfolio-link caps (data/portfolio-link-policy.json) are settled
        # first, before the disclosure is placed: the rebalancer may unlink a
        # surplus citation, and the chrome installer then discloses only what
        # the page still links.
        run: |
          python3 scripts/rebalance_portfolio_links.py --write
          python3 scripts/backfill_rel_attributes.py
          python3 scripts/build_editorial_pages.py --write
          python3 scripts/build_robots.py --write
          python3 scripts/install_editorial_chrome.py --write
      - name: Materialize public IndexNow key files when configured
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: python3 scripts/prepare_indexnow_keys.py
      - name: Self-heal and verify portfolio backlinks
        run: |
          python3 scripts/portfolio_backlink_engine.py repair
          python3 scripts/portfolio_backlink_engine.py verify-local
          python3 scripts/portfolio_backlink_engine.py health
      - name: Refresh owner agency dashboard
        run: python3 scripts/build_agency_dashboard.py
      - name: Rebuild the measured search plan against today's tree
        run: python3 scripts/search_intelligence/build_search_plan.py --write
      - name: Validate generated release
        run: python3 scripts/validate.py release
      - name: Auto-post social queue (non-blocking)
        continue-on-error: true
        env:
          # Enablement is DECLARED in data/social-brand-policy.json (platforms.*.enabled).
          # These pass the repository variable through as an override only: unset expands
          # to an empty string, which scripts/lib/social_platforms.py reads as "no opinion"
          # and defers to the declaration. A literal '|| true' here would be a second,
          # silent answer to a question the declaration already answers.
          ENABLE_LINKEDIN_POSTING: ${{ vars.ENABLE_LINKEDIN_POSTING }}
          ENABLE_X_POSTING: ${{ vars.ENABLE_X_POSTING }}
          REQUIRE_SOCIAL_SECRETS: ${{ vars.REQUIRE_SOCIAL_SECRETS || 'true' }}
          FAIL_ON_SOCIAL_POST_FAILURE: ${{ vars.FAIL_ON_SOCIAL_POST_FAILURE || 'false' }}
          SOCIAL_DRY_RUN: ${{ vars.SOCIAL_DRY_RUN || 'false' }}
          LINKEDIN_DAILY_LIMIT: ${{ vars.LINKEDIN_DAILY_LIMIT || '3' }}
          X_DAILY_LIMIT: ${{ vars.X_DAILY_LIMIT || '8' }}
          SOCIAL_RUN_LIMIT: ${{ vars.SOCIAL_RUN_LIMIT || '3' }}
          SOCIAL_POST_MIN_INTERVAL_SECONDS: ${{ vars.SOCIAL_POST_MIN_INTERVAL_SECONDS || '90' }}
          MAX_SOCIAL_SIMILARITY: ${{ vars.MAX_SOCIAL_SIMILARITY || '0.86' }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202606' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          # The credential that actually carries X. X's own API above is
          # pay-per-use and unfunded, so it is switched off and contacted zero
          # times; this token hands the day's X posts to Buffer's free queue
          # instead. Read only here, at runtime, and never written to a file.
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          ENABLE_X_BUFFER_ROUTE: ${{ vars.ENABLE_X_BUFFER_ROUTE }}
        run: python3 scripts/social_publisher.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The cap is applied inside the generator, before anything is written.
      # This is the second, independent check that it held - and the point where
      # a publish that did stay inside the cap is recorded, so the ledger the
      # gate measures against moves with the library instead of freezing and
      # turning the cap into a ratchet.
      #
      # Ordering matters and is enforced by
      # scripts/validators/validate_cadence_gate_integrity.js: an over-cap run
      # fails at the gate and never reaches the accept step, so this cannot
      # launder a violation. On a day with nothing to publish the accept is a
      # no-op and says so.
      - name: Cadence gate
        run: npm run cadence:gate

      - name: Record a cleared publish in the cadence baseline
        run: |
          npm run cadence:accept -- --reason "Authority V4.2 autopilot run ${{ github.run_id }} on $(date -u +%F): the generator capped itself to data/cadence/policy.json:new_pages_per_week before writing, and the cadence gate cleared before this step, so what is being accepted is a publish that stayed inside the declared rate."

      - name: Commit generated content, reports, and social ledger
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Authority V4.2 autopilot: pages, validation, social auto-post ledger"
          file_pattern: "sites/** data/** reports/**"
      - name: Create failure issue
        if: failure()
        uses: dacbd/create-issue-action@v2
        with:
          token: ${{ github.token }}
          title: "Authority V4.2 autopilot failed"
          body: "The daily authority autopilot or social auto-poster failed. Review this workflow run before increasing publishing volume."
